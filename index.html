<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Batchit</title>
    <meta name="description" content="Real-time chat platform with end-to-end encryption, 24-hour stories, community posts and following, voice and HD video calling, synchronized website streaming & co-browsing, and an admin control panel." />
    <meta property="og:title" content="Batchit" />
    <meta property="og:description" content="Real-time chat platform with end-to-end encryption, 24-hour stories, community posts and following, voice and HD video calling, synchronized website streaming & co-browsing, and an admin control panel." />
    
    <!-- PWA & Android Meta Tags -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Batchit" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden select-none">
    <div id="root">
      <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#020617;color:#94a3b8;font-family:sans-serif;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px auto;"></div>
          <div style="font-size:14px;font-weight:600;color:#f1f5f9;letter-spacing:0.05em;">Batchit</div>
          <div style="font-size:11px;color:#64748b;margin-top:4px;">Connecting encrypted workspace...</div>
        </div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up legacy v1 caches and manage service worker
      if ('serviceWorker' in navigator) {
        if (window.caches) {
          caches.delete('batchit-cache-v1').catch(() => {});
        }
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('[SW] Registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
